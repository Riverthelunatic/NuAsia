<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nutree Skincare</title>
<style>
    body {
        font-family: Arial, sans-serif;
        line-height: 1.6;
        margin: 0;
        padding: 0;
        color: #222;
        background-color: rgba(106, 124, 86, 0.9);
    }

    .back-button {
        position: fixed;
        top: 10px;
        left: 10px;
        background-color: white;
        color: rgba(106, 124, 86, 1);
        padding: 5px 10px;
        border-radius: 4px;
        font-size: 0.9rem;
        text-decoration: none;
        font-weight: bold;
        box-shadow: 0px 2px 4px rgba(0,0,0,0.2);
        z-index: 1000;
    }
    .back-button:hover {
        background-color: rgba(106, 124, 86, 1);
        color: white;
    }

    .container {
        max-width: 900px;
        margin: 0 auto;
        padding: 20px;
    }

    h1 {
        font-size: 2rem;
        margin-bottom: 15px;
        font-weight: bold;
    }

    h2 {
        font-size: 1.8rem;
        margin-top: 20px;
        margin-bottom: 10px;
    }

    p {
        margin-bottom: 15px;
    }

    ul {
        margin: 0 0 15px 20px;
        padding: 0;
    }

    ul li {
        margin-bottom: 8px;
    }

    .full-width {
        background: rgba(255, 255, 255, 0.9);
        padding: 20px;
        border-radius: 8px;
        margin-bottom: 20px;
    }

    .grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 20px;
    }

    .grid-item {
        background: rgba(255, 255, 255, 0.9);
        padding: 15px;
        border-radius: 8px;
        text-align: center;
    }

    .grid-item img {
        max-width: 100%;
        height: auto;
        display: block;
        margin-bottom: 10px;
    }

    .button {
        display: inline-block;
        background-color: #fff;
        color: rgba(106, 124, 86, 1);
        padding: 10px 20px;
        border: none;
        border-radius: 5px;
        text-decoration: none;
        font-weight: bold;
        transition: background-color 0.3s ease, color 0.3s ease;
    }

    .button:hover {
        background-color: rgba(106, 124, 86, 1);
        color: #fff;
    }

    .span-two {
        grid-column: span 2;
    }

    @media (max-width: 600px) {
        .grid {
            grid-template-columns: 1fr;
        }
        .span-two {
            grid-column: span 1;
        }
        h1 {
            font-size: 1.5rem;
        }
        h2 {
            font-size: 1.4rem;
        }
    }
    .products-section {
        background-color: #9ca785; 
        padding: 60px 20px;
        text-align: center;
    }
    .products-section h2 {
      font-size: 2rem;
      color: #fff;
      margin-bottom: 40px;
      font-weight: bold;
    }
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 40px;
      max-width: 1000px;
      margin: 0 auto;
    }
    .product-item {
      text-align: center;
      color: #fff;
    }
    .product-item img {
      width: 180px;
      height: auto;
      border-radius: 8px;
      margin-bottom: 15px;
    }
    .product-item h3 {
      color: rgb(210, 171, 73);
      font-size: 1rem;
      text-transform: uppercase;
      margin: 10px 0 5px;
    }
    .product-item p {
      font-size: 0.9rem;
      margin: 0;
    }
</style>
</head>
<body>
    <div class="navbar">
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="https://nutruebeauty.com//">Services/</a>
        <a href="contactus.html">Contact Us</a>
    </div>

    <div class="products-grid">
      <div class="product-item">
        <img src="your-image1.jpg" alt="Skincare">
        <h3>Skincare Products</h3>
        <p>Everything you need from cleansing to moisturising</p>
      </div>
      <div class="product-item">
        <img src="your-image2.jpg" alt="Makeup">
        <h3>Makeup Products</h3>
        <p>Look fresh for a day in the sun or a fun night out!</p>
      </div>
      <div class="product-item">
        <img src="your-image3.jpg" alt="Accessories">
        <h3>Accessories</h3>
        <p>Make your beauty routine as smooth as possible</p>
      </div>
      <div class="product-item">
        <img src="your-image4.jpg" alt="">
      </div>
      <div class="product-item">
        <img src="your-image5.jpg" alt="">
      </div>
      <div class="product-item">
        <img src="your-image6.jpg" alt="">
      </div>
      <div class="product-item">
        <img src="your-image7.jpg" alt="">
      </div>
      <div class="product-item">
        <img src="your-image8.jpg" alt="">
      </div>
      <div class="product-item">
        <img src="your-image9.jpg" alt="">
      </div>
    </div>



</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NuTree Skincare</title>
<style>
    body {
        font-family: Arial, sans-serif;
        line-height: 1.6;
        margin: 0;
        padding: 0;
        color: #222;
        background-color: rgba(106, 124, 86, 0.9);
    }

    .back-button {
        position: fixed;
        top: 10px;
        left: 10px;
        background-color: white;
        color: rgba(106, 124, 86, 1);
        padding: 5px 10px;
        border-radius: 4px;
        font-size: 0.9rem;
        text-decoration: none;
        font-weight: bold;
        box-shadow: 0px 2px 4px rgba(0,0,0,0.2);
        z-index: 1000;
    }
    .back-button:hover {
        background-color: rgba(106, 124, 86, 1);
        color: white;
    }

    .container {
        max-width: 900px;
        margin: 0 auto;
        padding: 20px;
    }

    h1 {
        font-size: 2rem;
        margin-bottom: 15px;
        font-weight: bold;
    }

    h2 {
        font-size: 1.8rem;
        margin-top: 20px;
        margin-bottom: 10px;
    }

    p {
        margin-bottom: 15px;
    }

    ul {
        margin: 0 0 15px 20px;
        padding: 0;
    }

    ul li {
        margin-bottom: 8px;
    }

    .full-width {
        background: rgba(255, 255, 255, 0.9);
        padding: 20px;
        border-radius: 8px;
        margin-bottom: 20px;
    }

    .grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 20px;
    }

    .grid-item {
        background: rgba(255, 255, 255, 0.9);
        padding: 15px;
        border-radius: 8px;
        text-align: center;
    }

    .grid-item img {
        max-width: 100%;
        height: auto;
        display: block;
        margin-bottom: 10px;
    }

    .button {
        display: inline-block;
        background-color: #fff;
        color: rgba(106, 124, 86, 1);
        padding: 10px 20px;
        border: none;
        border-radius: 5px;
        text-decoration: none;
        font-weight: bold;
        transition: background-color 0.3s ease, color 0.3s ease;
    }

    .button:hover {
        background-color: rgba(106, 124, 86, 1);
        color: #fff;
    }

    .span-two {
        grid-column: span 2;
    }

    @media (max-width: 600px) {
        .grid {
            grid-template-columns: 1fr;
        }
        .span-two {
            grid-column: span 1;
        }
        h1 {
            font-size: 1.5rem;
        }
        h2 {
            font-size: 1.4rem;
        }
    }
    .products-section {
        background-color: #9ca785; 
        padding: 60px 20px;
        text-align: center;
    }
    .products-section h2 {
      font-size: 2rem;
      color: #fff;
      margin-bottom: 40px;
      font-weight: bold;
    }
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 40px;
      max-width: 1000px;
      margin: 0 auto;
    }
    .product-item {
      text-align: center;
      color: #fff;
    }
    .product-item img {
      width: 180px;
      height: auto;
      border-radius: 8px;
      margin-bottom: 15px;
    }
    .product-item h3 {
      color: rgb(210, 171, 73);
      font-size: 1rem;
      text-transform: uppercase;
      margin: 10px 0 5px;
    }
    .product-item p {
      font-size: 0.9rem;
      margin: 0;
    }
    .navbar {
        background-color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 15px 0;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        position: sticky;
        top: 0;
        z-index: 1000;
        margin-bottom: 10px;
    }

    .navbar a {
        color: black;
        text-decoration: none;
        margin: 0 20px;
        font-size: 16px;
        transition: color 0.3s ease;
    }

    .navbar a:hover {
        color: #54845d; 
    }

    .about-section {
      background-color: #f8eadd; 
      padding: 20px 20px;
      text-align: center;
    }
    .about-section h2 {
      font-size: 1.8rem;
      font-weight: bold;
      margin-bottom: 20px;
      line-height: 0.7;
      color: #6c4f32;
    }
    .about-section p {
      font-size: 1rem;
      line-height: 1.2;
      max-width: 700px;
      margin: 10px auto;
      color: #444;
    }
    .about-section ul {
      list-style: none;
      padding: 0;
      margin: 20px auto;
      max-width: 600px;
      text-align: left;
    }
    .about-section ul li {
      font-size: 1rem;
      margin: 8px 0;
      position: relative;
      padding-left: 20px;
    }
    .about-section ul li::before {
      content: "•";
      position: absolute;
      left: 0;
      color: #6c4f32;
      font-weight: bold;
    }
</style>
</head>
